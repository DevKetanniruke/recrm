<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3b82f6" />
      <stop offset="100%" stop-color="#1d4ed8" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#1e40af" flood-opacity="0.3"/>
    </filter>
  </defs>

  <!-- Rounded Gradient Square -->
  <rect x="5" y="5" width="90" height="90" rx="24" fill="url(#bgGrad)" filter="url(#glow)"/>

  <!-- Main Building -->
  <path d="M 28 80 L 28 32 C 28 30 30 28 32 28 L 68 28 C 70 28 72 30 72 32 L 72 80 Z" fill="#ffffff" />
  
  <!-- Windows Grid -->
  <rect x="36" y="36" width="9" height="9" rx="2" fill="#2563eb"/>
  <rect x="55" y="36" width="9" height="9" rx="2" fill="#2563eb"/>
  
  <rect x="36" y="50" width="9" height="9" rx="2" fill="#2563eb"/>
  <rect x="55" y="50" width="9" height="9" rx="2" fill="#2563eb"/>
  
  <rect x="36" y="64" width="9" height="9" rx="2" fill="#2563eb"/>
  <rect x="55" y="64" width="9" height="9" rx="2" fill="#2563eb"/>

  <!-- Entrance Door -->
  <path d="M 45 80 L 45 70 C 45 68 47 66 49 66 L 51 66 C 53 66 55 68 55 70 L 55 80 Z" fill="#1d4ed8"/>
</svg>
